<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JAM IT, DA! — 다운로드</title>
<meta name="description" content="JAM IT, DA! 베타 클라이언트를 다운로드하세요." />
<link rel="icon" href="assets/images/logo.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <img class="topbar__logo" src="assets/images/logo-wide.png" alt="JAM IT, DA!" />
</header>

<section class="hero">
  <img class="hero__bg" src="assets/images/stage-bg.png" alt="" />
  <div class="hero__overlay"></div>

  <div class="hero__cast">
    <img class="cast cast--red"    src="assets/images/char-red.png"    alt="보컬 캐릭터" />
    <img class="cast cast--yellow" src="assets/images/char-yellow.png" alt="드럼 캐릭터" />
    <img class="cast cast--green"  src="assets/images/char-green.png"  alt="기타 캐릭터" />
    <img class="cast cast--blue"   src="assets/images/char-blue.png"   alt="키보드 캐릭터" />
  </div>

  <div class="hero__content">
    <h1 class="hero__title">JAM IT, DA!</h1>
    <p class="hero__subtitle">모두가 함께 즐기는 온라인 합주 게임</p>

    <a class="download-btn" href="/download">
      <span class="download-btn__icon">⬇</span>
      <span class="download-btn__text">
        <strong>지금 다운로드</strong>
        <small id="fileMeta">Windows · Beta</small>
      </span>
    </a>

    <p class="hero__note">베타 버전은 사전 안내 없이 변경될 수 있습니다.</p>
  </div>
</section>

<footer class="footer">
  <p>&copy; 2026 JAM IT, DA! All rights reserved.</p>
</footer>

</body>
</html>
